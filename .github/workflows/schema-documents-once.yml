name: Apply document schema patch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/schema-documents-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Prisma schema
        run: node scripts/patch-documents-schema.mjs
      - name: Commit schema patch
        run: |
          if git diff --quiet; then
            echo "No schema changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "feat: add document attachment model"
          git push
